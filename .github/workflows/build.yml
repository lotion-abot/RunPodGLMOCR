name: Build and push GLM-OCR worker

# WHY NOT RunPod's GitHub integration: it needs repo ownership, and this repo lives
# under an organization. Building here and pushing to GHCR removes that dependency
# entirely - RunPod just pulls an image URL.
#
# WHY GHCR and not Docker Hub: the image bakes selftest_page.png, a REAL client audit
# page, so the image must stay PRIVATE. GHCR gives private packages for free and
# authenticates with the built-in GITHUB_TOKEN - no extra secret to manage here.

# MANUAL ONLY. We moved to local build+push (build_push.ps1): the layer cache makes a
# code-change rebuild take seconds instead of ~10 min per CI round, and the pre-push
# probe stops a broken image before 8-12 GB goes over the wire.
#
# This stays as the fallback for when the local machine can't build - a clean-room
# rebuild with no local state. Run it from the Actions tab.
#
# Do NOT re-enable the push trigger while local push is the primary path: two builders
# racing on the same tags is how you end up unsure which image is actually deployed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The vLLM base image plus ~2GB of baked models blows past the runner's ~14GB
      # default free space. This frees ~30GB. The cog build needed the same treatment.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: false
          large-packages: true
          swap-storage: true

      # GHCR rejects uppercase in image names; this repo is "RunPodGLMOCR".
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Always tag with the commit SHA. Pin the RunPod endpoint to a SHA tag, not
          # :latest - "which image is actually running" must never be a guess.
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          provenance: false

      - name: Image reference
        run: |
          echo "::notice title=Pin this in RunPod::${{ steps.img.outputs.name }}:${{ github.sha }}"
